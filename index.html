<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auto Video Splitter</title>
  <script src="https://unpkg.com"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; text-align: center; }
    .drop-zone { border: 2px dashed #555; padding: 40px; cursor: pointer; margin-bottom: 20px; border-radius: 10px; }
    .drop-zone:hover { background-color: #f9f9f9; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
    button { cursor: pointer; background-color: #0070f3; color: white; border: none; border-radius: 5px; }
  </style>
</head>
<body>

  <h2>Auto Video Splitter</h2>
  
  <div class="drop-zone" id="dropZone">
    Drag & Drop Video Here or Click to Import from PC
    <input type="file" id="fileInput" accept="video/*" hidden>
  </div>

  <div>
    <label>Split every (seconds): </label>
    <input type="number" id="splitSeconds" value="30" min="1">
    <button id="splitBtn">Auto Split & Export ZIP</button>
  </div>

  <p id="status">Status: Ready</p>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });
    let selectedFile = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('status');

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) statusText.innerText = `Selected: ${selectedFile.name}`;
    };

    dropZone.ondragover = (e) => e.preventDefault();
    dropZone.ondrop = (e) => {
      e.preventDefault();
      selectedFile = e.dataTransfer.files[0];
      if (selectedFile) statusText.innerText = `Selected: ${selectedFile.name}`;
    };

    document.getElementById('splitBtn').onclick = async () => {
      if (!selectedFile) return alert("Pehle video select karein!");
      
      const seconds = document.getElementById('splitSeconds').value;
      statusText.innerText = "Loading engine & splitting video... (Thoda intezar karein)";

      if (!ffmpeg.isLoaded()) await ffmpeg.load();

      ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(selectedFile));

      await ffmpeg.run(
        '-i', 'input.mp4',
        '-c', 'copy',
        '-map', '0',
        '-segment_time', seconds.toString(),
        '-f', 'segment',
        '-reset_timestamps', '1',
        'part_%03d.mp4'
      );

      statusText.innerText = "Creating ZIP file...";
      const zip = new JSZip();
      const files = ffmpeg.FS('readdir', '/').filter(f => f.startsWith('part_'));

      files.forEach(file => {
        const data = ffmpeg.FS('readFile', file);
        zip.file(file, data);
      });

      const content = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = "split_videos.zip";
      link.click();

      statusText.innerText = `Done! ${files.length} parts exported.`;
    };
  </script>
</body>
</html>
